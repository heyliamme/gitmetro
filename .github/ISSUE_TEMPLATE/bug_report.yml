name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, VS Code (or other editor), GitMetro, and `git --version`
    validations:
      required: true
  - type: textarea
    id: graph
    attributes:
      label: If the graph looks wrong
      description: Paste `git log --graph --oneline -30` for that part of history (feel free to redact messages), and a screenshot.
